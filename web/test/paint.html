<!doctype html>
<meta charset="utf-8">
<title>Paintify web test</title>
<script type="module">
import { startPainter } from '../painter.js';
window.paintTest = async (imgUrl, styleKeys, settings = {}) => {
  const p = await startPainter({ base: '..' });
  const img = await createImageBitmap(await (await fetch(imgUrl)).blob());
  const c = new OffscreenCanvas(img.width, img.height), cx = c.getContext('2d');
  cx.drawImage(img, 0, 0);
  const rgba = cx.getImageData(0, 0, img.width, img.height).data;
  await p.setSourcePixels(new Uint8Array(rgba.buffer), img.width, img.height);
  const out = {};
  for (const key of styleKeys) {
    const idx = key === 'none' ? 0 : p.styles.findIndex(s => s.key === key);
    p.setStyle(idx);
    for (const [k, v] of Object.entries(settings)) p.set(k, v);
    const t0 = performance.now();
    for (let i = 0; i < 3; i++) await p.render();
    const im = await p.read();
    const ms = performance.now() - t0;
    const oc = new OffscreenCanvas(im.width, im.height);
    oc.getContext('2d').putImageData(im, 0, 0);
    const blob = await oc.convertToBlob({ type: 'image/png' });
    const bytes = new Uint8Array(await blob.arrayBuffer());
    let bin = ''; for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode(...bytes.subarray(i, i + 32768));
    const b64 = btoa(bin);
    out[key] = { png: b64, ms, stats: p.stats() };
  }
  return out;
};
window.ready = true;
window.regressionTest = async imgUrl => {
  const p = await startPainter({ base: '..' });
  const img = await createImageBitmap(await (await fetch(imgUrl)).blob());
  const canvas = new OffscreenCanvas(256, 256), ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, 256, 256);
  await p.setSource(canvas, 256, 256);
  const check = (ok, message) => { if (!ok) throw new Error(message); };
  const initial = p.saveLook();
  p.set('p.tensorSigma', 2.5); p.set('tensorOn', 1);
  await p.render();
  p.set('tensorOn', 0); await p.render();
  check(p.get('p.tensorSigma') === 2.5, 'Off render lost smoothing amount');
  const offLook = p.saveLook();
  p.set('tensorOn', 1); await p.render();
  check(p.get('p.tensorSigma') === 2.5, 'Reenable lost smoothing amount');
  check(!p.loadLook(offLook), 'Off smoothing look failed to load');
  check(p.get('tensorOn') === 0 && p.get('p.tensorSigma') === 2.5, 'Smoothing look did not preserve switch and amount');
  check(!p.loadLook(initial), 'Initial look failed to load');
  p.setStyle(p.styles.findIndex(s => s.key === 'vangogh'));
  const styledLook = p.saveLook();
  check(styledLook.includes('style-block '), 'Styled look has no style block');
  const legacy = styledLook.replace(/^# paintify-tensor-on=.*\n/m, '');
  check(!p.loadLook(legacy), 'Original-format styled look failed to load');
  check(!p.loadLook(styledLook), 'Current styled look failed to load');
  check(!p.loadLook(initial), 'Base look failed to load');
  return { checks: 'smoothing retention and switch state, original/current styled looks, base look restoration' };
};
</script>
